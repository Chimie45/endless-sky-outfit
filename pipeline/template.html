<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Drydock — Endless Sky Outfit Builder</title>
<style>/*__CSS__*/</style>

<header>
  <div class="brand">
    <span class="eyebrow">Drydock v0.3.42 · ES data v<span id="ver"></span></span>
    <span class="name">DRY<b>DOCK</b></span>
  </div>
  <div class="ctrl">
    <label>Ship</label>
    <button class="shippick" id="shipPickBtn" aria-haspopup="dialog">
      <span class="sp-art" id="spArt"></span>
      <span class="sp-txt"><b id="spName">—</b><small id="spMeta"></small></span>
      <span class="sp-caret">▾</span>
    </button>
  </div>
  <div class="spacer"></div>
  <div class="costchip">
    <div class="eyebrow">Total cost</div>
    <div class="v mono" id="totalCost">0</div>
  </div>
  <button class="linkbtn" id="resetBtn">Reset</button>
  <button class="linkbtn gear" id="gearBtn" title="Settings" aria-label="Settings">⚙</button>
</header>

<svg width="0" height="0" aria-hidden="true" style="position:absolute"><defs>
  <filter id="esShip" color-interpolation-filters="sRGB" x="-15%" y="-15%" width="130%" height="130%">
    <feColorMatrix type="saturate" values="0" result="g"/>
    <!-- darker grayscale fill -->
    <feComponentTransfer in="g" result="fill">
      <feFuncR type="linear" slope="0.55"/><feFuncG type="linear" slope="0.55"/><feFuncB type="linear" slope="0.55"/>
    </feComponentTransfer>
    <!-- faint, softened interior structure (muted, low noise) -->
    <feConvolveMatrix in="g" order="3" preserveAlpha="true" kernelMatrix="0 -1 0 -1 4 -1 0 -1 0" result="edge"/>
    <feGaussianBlur in="edge" stdDeviation="0.6" result="edgeS"/>
    <feComponentTransfer in="edgeS" result="edgeB">
      <feFuncR type="linear" slope="0.46"/><feFuncG type="linear" slope="0.46"/><feFuncB type="linear" slope="0.48"/>
    </feComponentTransfer>
    <!-- soft mid-grey silhouette outline stroke -->
    <feMorphology in="SourceAlpha" operator="dilate" radius="1.4" result="dil"/>
    <feComposite in="dil" in2="SourceAlpha" operator="out" result="ring"/>
    <feFlood flood-color="#7c8696" result="oc"/>
    <feComposite in="oc" in2="ring" operator="in" result="outlineS"/>
    <feGaussianBlur in="outlineS" stdDeviation="0.6" result="outline"/>
    <feMerge><feMergeNode in="fill"/><feMergeNode in="edgeB"/><feMergeNode in="outline"/></feMerge>
  </filter>
</defs></svg>

<main>
  <!-- LEFT: ship art + schematic + variants + live status + installed loadout -->
  <section class="col left">
    <div class="leftbody">
      <div class="maincol">
        <div class="shipcard" id="shipcard">
          <div class="shiphead">
            <div class="shipid">
              <span class="fac" id="hullFaction"></span><span class="sep">/</span>
              <span class="cat" id="hullCat"></span><span class="sep">/</span>
              <span class="nm" id="hullName"></span>
            </div>
            <div class="alerts" id="alerts"></div>
          </div>
          <div class="cardbody">
            <div class="infocol">
              <div class="artbox" id="artbox"></div>
              <div class="quickstats" id="quickStats"></div>
              <div class="statgroup"><div class="eyebrow"><span>Capacity</span><span id="massReadout" class="mono"></span></div><div class="statpills" id="capPills"></div></div>
            </div>
            <div class="displaycol">
              <div class="stagewrap">
                <div class="stage" id="stage"></div>
                <div class="legend" id="legend">
                  <span><i style="background:var(--gun)"></i>Gun</span>
                  <span><i style="background:var(--turret)"></i>Turret</span>
                  <span><i style="background:var(--engine)"></i>Engine</span>
                  <span><i style="background:var(--bay)"></i>Bay</span>
                </div>
              </div>
            </div>
            <div class="rightstats">
              <div class="statgroup"><div class="eyebrow"><span>Movement &amp; defense</span></div><div class="statpills" id="movePills"></div></div>
              <div class="statgroup"><div class="eyebrow"><span>Energy &amp; heat</span><span class="mono">E · H /s</span></div><div class="statpills" id="ehPills"></div></div>
              <div class="presetgrid" id="presetGrid">
                <button class="pbtn" data-load="empty">Empty hull</button>
                <button class="pbtn" data-load="stock">Stock</button>
                <button class="pbtn" data-load="auto:cargo">Max cargo</button>
                <button class="pbtn" data-load="auto:crew">Max crew</button>
                <button class="pbtn act" id="fleetAddBtn">+ Add to Fleet</button>
                <button class="pbtn act" id="shareBtn">Share</button>
              </div>
            </div>
          </div>
          <div class="dropmsg">Drop to install</div>
        </div>
        <div class="fleetpanel" id="fleetPanel">
          <div class="fleet-head"><span class="fleet-title">Fleet</span><span class="fleet-count" id="fleetCount"></span></div>
          <div class="fleet-body">
            <div class="fleet-totals">
              <div><span class="ft-lbl">Total cargo</span><span class="ft-val mono" id="ftCargo">0</span></div>
              <div><span class="ft-lbl">Total crew</span><span class="ft-val mono" id="ftCrew">0</span></div>
              <div><span class="ft-lbl">Daily cost</span><span class="ft-val mono" id="ftCost" title="Crew salaries at 100 cr/day each (the pilot is unpaid)">0</span></div>
            </div>
            <div class="fleet-list" id="fleetList"></div>
            <div class="fleet-actions">
              <button class="fbtn" id="fleetImport">Import</button>
              <button class="fbtn" id="fleetShare">Share</button>
              <button class="fbtn" id="fleetClearBtn">Clear</button>
              <button class="fbtn" id="fleetRemove">Remove</button>
              <button class="fbtn" id="fleetCopy">Copy Ship</button>
            </div>
          </div>
        </div>
      </div>

      <div class="loadpanel">
        <div class="presetbar">
          <div class="eyebrow">Variants</div>
          <div class="variants" id="variants"></div>
        </div>
        <div class="eyebrow"><span>Installed loadout</span><span id="installCount" class="mono"></span></div>
        <div id="loadout"></div>
      </div>
    </div>

  </section>

  <!-- RIGHT: outfitter catalog -->
  <section class="col right">
    <div class="searchrow">
      <div class="eyebrow" style="margin-bottom:6px">Outfitter</div>
      <input type="search" id="search" placeholder="Search outfits…" autocomplete="off">
      <div class="catbar" id="catbar"></div>
    </div>
    <div class="ogrid" id="catalog"></div>
  </section>
</main>

<div class="drawer" id="drawer">
  <div class="panel">
    <button class="linkbtn x" id="drawerX">Close</button>
    <div id="drawerBody"></div>
  </div>
</div>

<div class="modal" id="settings">
  <div class="sheet">
    <button class="modalx" id="settingsX" aria-label="Close">×</button>
    <h2 style="color:var(--bright);margin:0 0 16px">Settings</h2>
    <div class="setrow">
      <label>Spoiler / tech access</label>
      <div class="tierbtns" id="tierBtns">
        <button data-tier="0">Human</button>
        <button data-tier="1">+First contact</button>
        <button data-tier="2">+Deep space</button>
        <button data-tier="3">All</button>
      </div>
    </div>
    <div class="setrow">
      <label>Theme</label>
      <div class="tierbtns" id="themeBtns">
        <button data-theme="blue">Blue</button>
        <button data-theme="dark">Dark</button>
        <button data-theme="light">Light</button>
      </div>
    </div>
    <div class="setrow">
      <label>Content</label>
      <button class="toggle" id="unrelBtn" aria-pressed="false">Show unreleased</button>
    </div>
  </div>
</div>

<div class="modal" id="shipPicker">
  <div class="sheet picker">
    <button class="modalx" id="pickerX" aria-label="Close">×</button>
    <h2 style="color:var(--bright);margin:0 0 12px">Choose a ship</h2>
    <div class="pickerbody">
      <div class="pickertabs" id="pickerFac"></div>
      <div class="pickermain">
        <div class="shipgrid" id="pickerGrid"></div>
        <input type="search" id="pickerSearch" placeholder="Search ships…" autocomplete="off">
      </div>
    </div>
  </div>
</div>

<div id="toast" class="toast"></div>

<script>/*__JS__*/</script>
